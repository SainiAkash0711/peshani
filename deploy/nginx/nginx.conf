# Production reverse proxy - the ONLY publicly-reachable service in
# docker-compose.prod.yml. Terminates TLS, redirects HTTP->HTTPS, applies
# baseline security headers, and routes:
#   /api/*      -> api container (NestJS, port 4000)
#   /admin/*    -> admin container (nginx-served static SPA, port 80)
#   everything else -> web container (Next.js, port 3000)
#
# Certificates are NEVER committed to this repo (deploy/nginx/certs/ is
# gitignored and bind-mounted at runtime) - see the Production Runbook's
# TLS section for provisioning/renewal (e.g. certbot/Let's Encrypt, or a
# managed load balancer's own TLS termination in front of this proxy
# instead, in which case this file's TLS server block would be replaced
# with a plain-HTTP upstream listener - documented as an alternative
# topology in the runbook).

user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Matches MEDIA_MAX_UPLOAD_BYTES's default (10 MB) plus headroom for
    # multipart overhead - keep in sync if that env var is raised.
    client_max_body_size 12m;

    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    upstream api_upstream {
        server api:4000;
    }
    upstream web_upstream {
        server web:3000;
    }
    upstream admin_upstream {
        server admin:80;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;
        # ACME HTTP-01 challenge path (certbot) must stay on plain HTTP even
        # after HTTPS is enabled - everything else redirects.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health endpoints are proxied but not otherwise special-cased here -
        # a load balancer in front of this proxy (if one exists in the real
        # topology) should point its own health checks at
        # https://<host>/api/v1/health/ready (readiness) directly.
        location /api/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /admin/ {
            rewrite ^/admin/?(.*)$ /$1 break;
            proxy_pass http://admin_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
