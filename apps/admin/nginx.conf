# Serves the admin SPA's static build. All non-file routes fall back to
# index.html so react-router's client-side routes (e.g. /orders/:orderNumber)
# work on a hard refresh/direct link, not just client-side navigation.
#
# IMPORTANT nginx gotcha (found via real container testing, not assumed):
# `add_header` directives are NOT inherited into a location block that
# defines its OWN `add_header` - a child location with even one add_header
# of its own discards ALL parent-level add_header directives, not just the
# ones it duplicates. Since `try_files ... /index.html` internally
# redirects "/" to "/index.html", which is then matched by the MORE
# SPECIFIC `location = /index.html` block below (not `location /`), that
# block's own `Cache-Control` add_header silently suppressed the three
# security headers defined at the server level for every request that
# falls back to index.html - i.e. every SPA route. The same applies to
# `location /assets/`. Fix: repeat the security headers in every location
# that defines its own add_header, rather than relying on inheritance.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (Vite's default `assets/*-[hash].js/css`) are safe
    # to cache aggressively - a content change always produces a new
    # filename. index.html itself is intentionally NOT cached (see below),
    # so a deploy is always picked up on next load without a hard-refresh.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
